<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TST Panel</title><style>*{box-sizing:border-box}body{margin:0;background:#050000;color:#fff;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(120deg,#000,#170000,#650000,#090000,#000);background-size:400% 400%;animation:bg 10s ease infinite}@keyframes bg{50%{background-position:100% 50%}}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#0d0b0fdd;border:1px solid #422020;border-left:4px solid #f33;border-radius:15px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.btn,input,textarea{font:inherit}.btn{background:#160909;color:#f66;border:1px solid #572222;border-radius:10px;padding:11px 15px;cursor:pointer}.btn:hover{background:#f33;color:#fff}input,textarea{width:100%;background:#030303;color:#fff;border:1px solid #442020;border-radius:9px;padding:11px;margin:7px 0}.status{color:#f88;font-size:12px;min-height:18px}.muted{color:#888}.login{max-width:500px;margin:15vh auto}.event{border-left:4px solid #f33}.danger{border-color:#922;color:#f77}.hidden{display:none!important}.poll{border-top:1px solid #321919;padding-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main class="wrap"><div id="login" class="card login"><h1>TST PANEL</h1><p class="muted">Admin control panel</p><input id="pw" type="password" placeholder="Panel password"><button class="btn" id="loginBtn">ENTER</button><div id="loginStatus" class="status"></div></div><div id="panel" class="hidden"><div class="card"><h1>TST PANEL</h1><p class="muted">Control the TST Clicker events and global announcement.</p><button class="btn" id="logout">LOG OUT</button></div><div class="grid"><div class="card"><h2>EVENT CONTROL</h2><label>Event</label><select id="eventType"><option value="none">NONE — NO EVENT</option><option value="disco">DISCO EVENT</option><option value="gaming">GAMING EVENT</option></select><label>Multiplier (any × amount)</label><input id="mult" type="number" min="0.01" step="0.01" value="5"><label>Duration (seconds)</label><input id="duration" type="number" min="1" value="300"><div class="row"><button class="btn" id="startEvent">TURN EVENT ON</button><button class="btn danger" id="endEvent">END EVENT</button></div><div id="eventStatus" class="status"></div></div><div class="card"><h2>GLOBAL ANNOUNCEMENT</h2><textarea id="announce" placeholder="Announcement text"></textarea><input id="question" placeholder="Poll question (Yes/No or True/False)"><label>Poll answers</label><select id="pollType"><option value="yesno">YES / NO</option><option value="truefalse">TRUE / FALSE</option></select><div class="row"><button class="btn" id="publish">PUBLISH</button><button class="btn danger" id="clearAnn">CLEAR</button></div><div id="annStatus" class="status"></div></div></div><div class="card"><h2>ACCOUNT PROGRESS</h2><div id="accounts"></div></div></div></main><script>const P='TST_PANEL_PASSWORD_100';const REAL='FOXLrhe^x1F2m&qDMM$^fhv0mGhM&bs=-Z?CnrtdTeXfA1weWtrPBmka$2JE%R=7ZhWHEpVFSz_vtF3ZIG#8a4EYmi&1AowQ6U7P';const KEY='tstAccountsV2',EVENT_KEY='tstLiveStateV1',ANN_KEY='tstGlobalAnnouncementV1';const $=id=>document.getElementById(id);function accounts(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}function render(){const a=accounts().sort((x,y)=>y.score-x.score);$('accounts').innerHTML=a.length?'<table style="width:100%;border-collapse:collapse"><tr><th style="text-align:left">Player</th><th style="text-align:left">ID</th><th style="text-align:left">TSTs</th></tr>'+a.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.id)}</td><td>${x.score.toLocaleString()}</td></tr>`).join('')+'</table>':'<p class="muted">No accounts yet.</p>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('loginBtn').onclick=()=>{if($('pw').value!==REAL){$('loginStatus').textContent='Wrong password.';return}$('login').classList.add('hidden');$('panel').classList.remove('hidden');render()};$('logout').onclick=()=>{location.reload()};$('startEvent').onclick=()=>{const type=$('eventType').value,m=Number($('mult').value),d=Number($('duration').value);if(type==='none'){localStorage.removeItem(EVENT_KEY);$('eventStatus').textContent='No event is active.';return}if(!(m>0)||!(d>0)){ $('eventStatus').textContent='Enter valid multiplier and duration.';return}localStorage.setItem(EVENT_KEY,JSON.stringify({type,multiplier:m,until:Date.now()+d*1000}));$('eventStatus').textContent=(type==='disco'?'Disco Event':'Gaming Event')+' is ON at '+m+'×.';if(type==='disco')playTacos()};$('endEvent').onclick=()=>{localStorage.removeItem(EVENT_KEY);$('eventStatus').textContent='Event ended.'};$('publish').onclick=()=>{const text=$('announce').value.trim(),question=$('question').value.trim(),pollType=$('pollType').value;if(!text&&!question){$('annStatus').textContent='Enter announcement text or a poll question.';return}localStorage.setItem(ANN_KEY,JSON.stringify({text,question,pollType,up:0,down:0}));$('annStatus').textContent='Published.'};$('clearAnn').onclick=()=>{localStorage.removeItem(ANN_KEY);$('annStatus').textContent='Cleared.'};function playTacos(){try{const a=new Audio('https://www.youtube.com/watch?v=jBmhsV9NKPg');a.volume=.4;a.play().catch(()=>{})}catch(e){}}render();</script></body></html>
